# Configuração Netlify para Planilha Financeira

[build]
command = "npm run build"
publish = "dist/planilha-financeira/browser"
base = "planilha-financeira"

# Node.js version e variáveis de ambiente
[build.environment]
NODE_VERSION = "18.20.0"
NPM_VERSION = "10.5.0"

# Redireciona todas as rotas para index.html (necessário para Angular Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para otimização de cache
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache para assets estáticos (JS, CSS, etc)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache para bundle do Angular
[[headers]]
  for = "/*.bundle.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache menor para index.html (permite atualizações)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"